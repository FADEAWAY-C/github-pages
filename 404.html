<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Fade Away Consulting</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0B1119">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Page volontairement autonome : elle peut être servie depuis n'importe
     quelle URL, y compris profonde, où les chemins relatifs échoueraient. -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 40px 24px;
    background: #0B1119;
    color: #A9B6C4;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    text-align: center;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(760px 420px at 76% 6%, rgba(180,138,69,.22), transparent 62%),
      radial-gradient(600px 400px at 8% 94%, rgba(60,90,130,.22), transparent 60%);
    pointer-events: none;
  }
  .box { position: relative; max-width: 560px; }
  .mark { display: flex; flex-direction: column; gap: 7px; align-items: center; margin-bottom: 40px; }
  .mark i { display: block; height: 6px; border-radius: 3px; background: #D9B876; }
  .mark i:nth-child(1) { width: 84px; }
  .mark i:nth-child(2) { width: 66px; opacity: .72; }
  .mark i:nth-child(3) { width: 46px; opacity: .46; }
  .mark i:nth-child(4) { width: 28px; opacity: .24; }
  .code {
    font-size: .74rem; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: #B48A45; margin: 0 0 18px;
  }
  h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 500;
    font-size: clamp(1.9rem, 5vw, 2.7rem); line-height: 1.15;
    letter-spacing: -.015em; color: #fff; margin: 0 0 18px;
  }
  p { margin: 0 0 32px; color: #93A1B1; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 15px 28px; border-radius: 4px; border: 1px solid transparent;
    font-size: .93rem; font-weight: 600; text-decoration: none;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .primary { background: #B48A45; color: #fff; }
  .primary:hover { background: #9C7538; }
  .ghost { border-color: rgba(255,255,255,.18); color: #fff; }
  .ghost:hover { border-color: #fff; }
  @media (max-width: 480px) { .row { flex-direction: column; } a.btn { width: 100%; } }
</style>
</head>
<body>
  <main class="box">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="code">Erreur 404</p>
    <h1>Cette page s'est effacée</h1>
    <p>
      L'adresse demandée n'existe pas ou n'existe plus. Reprenons depuis
      l'accueil — ou dites-nous ce que vous cherchiez.
    </p>
    <div class="row">
      <a class="btn primary" href="/">Retour à l'accueil</a>
      <a class="btn ghost" href="/contact.html">Nous contacter</a>
    </div>
  </main>
</body>
</html>
